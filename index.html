<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer Notes-First</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #2f3437;
      --muted: #787774;
      --line: rgba(55, 53, 47, 0.12);
      --line-strong: rgba(55, 53, 47, 0.18);
      --accent: #2b8c95;
      --accent-soft: rgba(43, 140, 149, 0.10);
      --radius: 16px;
      --radius-sm: 10px;
      --label-size: 9px;
      --timer-size: 18px;
      --shadow-note: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 4px;
      display: flex;
      justify-content: center;
    }

    .widget {
      width: 100%;
      max-width: 800px; /* fits Notion embed */
      background: transparent;
      padding: 0;
      border: none;
    }

    /* === TOP ROW === */

    .top-widgets {
      display: flex;
      gap: 6px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: nowrap; /* keep 4×1 in typical Notion width */
    }

    .top-card {
      flex: 0 0 185px;          /* four narrow cards */
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 8px 6px;
      background: transparent;
      min-height: 150px;        /* compact height */
    }

    .panel,
    details.section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 8px 6px;
      background: transparent;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    .panel-header,
    .timer-row,
    details.section > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 18px;
      margin-bottom: 6px;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .clock-label,
    .section-title {
      display: inline-flex;
      align-items: center;
      font-size: var(--label-size);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
    }

    .clock-accent {
      color: #d7a077;
      margin-left: 3px;
      font-size: 10px;
    }

    .clock-box {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .clock-panel .panel-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2px 0;
    }

    .clock-time {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--fg);
      line-height: 1;
      text-align: center;
    }

    .clock-date {
      width: 100%;
      margin-top: 4px;
      text-align: center;
      font-size: 9px;
      font-weight: 500;
      color: #6f6e6b;
      letter-spacing: 0.01em;
    }

    /* === TIMER CARD === */

    .mode-row {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mode {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: 160ms ease;
    }

    .mode:hover {
      background: rgba(55, 53, 47, 0.04);
      color: var(--fg);
    }

    .mode.active {
      background: var(--accent-soft);
      border-color: rgba(43, 140, 149, 0.22);
      color: #2a7d85;
    }

    .alarm-header-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: 160ms ease;
    }

    .alarm-header-btn:hover {
      background: rgba(55, 53, 47, 0.04);
      color: var(--fg);
    }

    .alarm-header-btn.armed {
      background: rgba(55, 53, 47, 0.08);
      color: var(--fg);
      border-color: var(--line-strong);
    }

    .timer-main {
      display: flex;
      align-items: center;
      gap: 4px;       /* tighter, removes strange big bar feel */
      margin-top: 4px;
    }

    .timer-left {
      min-width: 100px;
    }

    .timer-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--timer-size);
      font-weight: 500;
      line-height: 1;
      padding: 0;
      border-radius: var(--radius-sm);
      outline: none;
      letter-spacing: -0.04em;
      color: var(--fg);
    }

    .timer-time:hover,
    .timer-time:focus {
      background: rgba(55, 53, 47, 0.04);
      padding: 2px 4px;
      margin: -2px -4px;
    }

    .status {
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
      margin-top: 4px;
    }

    .daily-total {
      margin-top: 2px;
      font-size: 8px;
      color: var(--muted);
    }

    .daily-total strong {
      font-weight: 600;
      color: var(--fg);
    }

    .progress-bar {
      flex: 1;
      height: 3px;           /* thin bar */
      background: rgba(55, 53, 47, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;       /* just under the text, not mid‑row */
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transform-origin: left center;
      transition: transform 0.9s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;       /* aligned with other cards’ content */
      flex-wrap: wrap;
    }

    .btn, .icon-btn, .mini-btn, .music-btn, .notes-add, .notes-clear {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .btn:hover, .icon-btn:hover, .mini-btn:hover, .music-btn:hover,
    .notes-add:hover, .notes-clear:hover {
      background: rgba(55, 53, 47, 0.04);
      transform: translateY(-1px);
    }

    .btn {
      padding: 6px 10px;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn.primary {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
    }

    .icon-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
    }

    /* === PERPLEXITY CARD === */

    .perplexity-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .perplexity-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px;
      align-items: center;
      width: 100%;
    }

    .perplexity-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 9px;
      outline: none;
      font-family: inherit;
      background: transparent;
      color: var(--fg);
      min-height: 32px;
    }

    .perplexity-input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 2px rgba(55, 53, 47, 0.08);
    }

    .mini-btn {
      padding: 0 10px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: 32px;
    }

    /* === MUSIC CARD === */

    .music-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      margin-top: 2px;
    }

    .music-btn {
      padding: 5px 9px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .music-btn.active {
      background: var(--accent-soft);
      color: #2a7d85;
      border-color: rgba(43, 140, 149, 0.22);
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: transparent;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-hint {
      margin-top: 4px;
      text-align: center;
      color: var(--muted);
      font-size: 7px;
      letter-spacing: 0.02em;
    }

    /* === STICKY NOTES SECTION === */

    .stack {
      display: grid;
      gap: 6px;
      margin-top: 6px;
    }

    details.section {
      border-radius: var(--radius);
      padding: 8px 8px 6px; /* match top-card */
    }

    .notes-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-bottom: 6px;
    }

    .notes-add {
      width: 22px;
      height: 22px;
      font-size: 14px;
    }

    .notes-clear {
      padding: 0 8px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      height: 22px;
    }

    .notes-clear:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .notes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 6px;
    }

    .sticky {
      --sticky-bg: #ECE4C8;
      position: relative;
      border-radius: 10px;
      padding: 9px;
      box-shadow: var(--shadow-note);
      min-height: 120px;
      background: var(--sticky-bg);
      border: 1px solid rgba(55, 53, 47, 0.10);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sticky-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 6px;
      padding-right: 14px;
    }

    .sticky-meta {
      font-size: 7px;
      letter-spacing: 0.01em;
      color: rgba(17,24,39,0.58);
      line-height: 1.35;
      max-width: 140px;
    }

    .sticky-colors {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(17,24,39,0.12);
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
      flex: 0 0 auto;
    }

    .color-dot.active {
      border-color: rgba(17,24,39,0.28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.65), 0 0 0 1px rgba(17,24,39,0.08);
      transform: scale(1.08);
    }

    .sticky-text {
      width: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 10px;
      line-height: 1.45;
      padding-right: 14px;
      font-family: inherit;
      color: var(--fg);
      overflow-y: auto;
      flex: 1;
    }

    .sticky-del {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 15px;
      height: 15px;
      border: none;
      background: transparent;
      font-size: 13px;
      color: rgba(17,24,39,0.38);
      cursor: pointer;
    }

    .notes-empty {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.02em;
      font-style: italic;
      padding-top: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      .top-widgets {
        flex-wrap: wrap;    /* only wrap on very small screens */
      }
      .top-card {
        flex: 0 0 calc(50% - 6px);
      }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="top-widgets">
      <!-- Clock -->
      <section class="top-card clock-panel">
        <div class="clock-box">
          <div class="panel-header">
            <div class="clock-label">Current Time <span class="clock-accent">+</span></div>
          </div>
          <div class="panel-body">
            <div class="clock-time" id="wallclockTime"></div>
            <div class="clock-date" id="wallclockDate">Eastern Time</div>
          </div>
        </div>
      </section>

      <!-- Timer -->
      <section class="top-card timer-panel">
        <div class="timer-row">
          <div class="section-title">Timer</div>
          <div class="mode-row" role="tablist" aria-label="Timer modes">
            <button class="mode active" data-mode="focus" type="button">Focus</button>
            <button class="mode" data-mode="break" type="button">Break</button>
            <button class="alarm-header-btn" id="alarmBtn" type="button">Alarm</button>
          </div>
        </div>

        <div class="panel-body">
          <div class="timer-main">
            <div class="timer-left">
              <div class="timer-time" id="timeDisplay" contenteditable="true" spellcheck="false">25:00</div>
              <div class="status" id="statusText">Focus ready</div>
              <div class="daily-total" id="dailyTotalText">Today: <strong>0m</strong> focus</div>
            </div>
            <div class="progress-bar" aria-hidden="true">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="controls-row">
            <button class="icon-btn" id="resetBtn" type="button" aria-label="Reset timer">
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
            </button>
            <button class="btn primary" id="startPauseBtn" type="button">Start</button>
            <button class="icon-btn" id="settingsToggle" type="button" aria-label="Toggle settings">
              <svg viewBox="0 0 24 24"><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Perplexity Search -->
      <section class="top-card search-panel">
        <div class="panel-header">
          <div class="section-title">Perplexity Search</div>
        </div>
        <div class="perplexity-panel panel-body">
          <form class="perplexity-form" id="perplexityForm">
            <label class="sr-only" for="perplexityInput">Ask Perplexity</label>
            <input id="perplexityInput" class="perplexity-input" type="text" placeholder="Ask anything..." autocomplete="off" required>
            <button class="mini-btn" type="submit">Go</button>
          </form>
        </div>
      </section>

      <!-- Music -->
      <details class="top-card music-panel" open>
        <summary>
          <span class="section-title">Music</span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <div class="panel-body">
          <div class="music-row" id="videoPlaylists"></div>
          <div class="video-frame">
            <iframe
              id="videoFrame"
              src="https://www.youtube-nocookie.com/embed/oPVte6aMprI?autoplay=0&rel=0&list=RDoPVte6aMprI"
              title="Music player"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
          </div>
          <div class="video-hint">Mini focus vibes.</div>
        </div>
      </details>
    </div>

    <!-- Sticky notes row -->
    <div class="stack">
      <details class="section" open>
        <summary>
          <span class="section-title">Sticky Notes</span>
        </summary>
        <div class="section-body">
          <div class="notes-actions">
            <button class="notes-add" id="addNoteBtn" type="button" aria-label="Add note">+</button>
            <button class="notes-clear" id="clearNotesBtn" type="button" disabled>Clear</button>
          </div>
          <div class="notes-list" id="notesList"></div>
          <div class="notes-empty" id="notesEmpty">No notes yet.</div>
        </div>
      </details>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tsWidget_v2';
    const NOTE_COLORS = ['#C9DAEA', '#ECE4C8', '#EBD9D5'];

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        return JSON.parse(raw) || {};
      } catch (e) { return {}; }
    }

    function saveStore(patch) {
      try {
        const current = loadStore();
        const next = Object.assign({}, current, patch);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } catch (e) {}
    }

    function normalizeNotes(notes) {
      if (!Array.isArray(notes)) return [];
      return notes.map(note => {
        if (typeof note === 'string') {
          return { text: note, color: '#ECE4C8', updatedAt: Date.now() };
        }
        return {
          text: typeof note?.text === 'string' ? note.text : '',
          color: typeof note?.color === 'string' ? note.color : '#ECE4C8',
          updatedAt: Number.isFinite(note?.updatedAt) ? note.updatedAt : Date.now()
        };
      });
    }

    function todayKey() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    const stored = loadStore();

    const state = {
      durations: {
        focus: (stored.durations && stored.durations.focus) || 25,
        break: (stored.durations && stored.durations.break) || 5
      },
      mode: 'focus',
      totalSeconds: 25 * 60,
      remainingSeconds: 25 * 60,
      running: false,
      intervalId: null,
      clearArmed: false,
      notes: normalizeNotes(stored.notes),
      focusTotals: stored.focusTotals || {},
      currentDateKey: todayKey()
    };

    state.totalSeconds = state.durations.focus * 60;
    state.remainingSeconds = state.totalSeconds;

    const modes = document.querySelectorAll('.mode');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusText = document.getElementById('statusText');
    const dailyTotalText = document.getElementById('dailyTotalText');
    const progressFill = document.getElementById('progressFill');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wallclockTime = document.getElementById('wallclockTime');
    const wallclockDate = document.getElementById('wallclockDate');
    const notesList = document.getElementById('notesList');
    const notesEmpty = document.getElementById('notesEmpty');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const clearNotesBtn = document.getElementById('clearNotesBtn');
    const perplexityForm = document.getElementById('perplexityForm');
    const perplexityInput = document.getElementById('perplexityInput');
    const videoFrame = document.getElementById('videoFrame');
    const videoPlaylists = document.getElementById('videoPlaylists');

    const playlists = [
      { label: 'Relax', url: 'https://www.youtube-nocookie.com/embed/oPVte6aMprI?autoplay=0&rel=0&list=RDoPVte6aMprI' },
      { label: 'Country', url: 'https://www.youtube-nocookie.com/embed/TsfDpW7PYN8?autoplay=0&rel=0&list=RDTsfDpW7PYN8' }
    ];

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateDailyTotalText() {
      const seconds = state.focusTotals[state.currentDateKey] || 0;
      const minutes = Math.floor(seconds / 60);
      const label = dailyTotalText.querySelector('strong');
      if (label) label.textContent = `${minutes}m`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(state.remainingSeconds);
      const ratio = state.totalSeconds > 0 ? state.remainingSeconds / state.totalSeconds : 0;
      progressFill.style.transform = `scaleX(${ratio})`;
      const label = state.mode === 'focus' ? 'Focus' : 'Break';
      statusText.textContent = state.running
        ? label + ' running'
        : (state.remainingSeconds === 0 ? label + ' done' : label + ' ready');
      startPauseBtn.textContent = state.running ? 'Pause' : 'Start';
      updateDailyTotalText();
    }

    function setMode(mode) {
      state.mode = mode;
      state.running = false;
      clearInterval(state.intervalId);
      state.intervalId = null;
      state.totalSeconds = state.durations[mode] * 60;
      state.remainingSeconds = state.totalSeconds;
      modes.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      updateDisplay();
    }

    function tick() {
      if (state.remainingSeconds > 0) {
        state.remainingSeconds -= 1;
        updateDisplay();
      } else {
        state.running = false;
        clearInterval(state.intervalId);
        state.intervalId = null;
        updateDisplay();
      }
    }

    function toggleTimer() {
      if (state.running) {
        state.running = false;
        clearInterval(state.intervalId);
        state.intervalId = null;
      } else {
        state.running = true;
        state.intervalId = setInterval(tick, 1000);
      }
      updateDisplay();
    }

    function resetTimer() {
      state.running = false;
      clearInterval(state.intervalId);
      state.intervalId = null;
      state.totalSeconds = state.durations[state.mode] * 60;
      state.remainingSeconds = state.totalSeconds;
      updateDisplay();
    }

    function updateClock() {
      const now = new Date();
      wallclockTime.textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      wallclockDate.textContent = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      }) + ' · Eastern Time';
    }

    function renderPlaylists() {
      videoPlaylists.innerHTML = '';
      playlists.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'music-btn' + (index === 0 ? ' active' : '');
        btn.type = 'button';
        btn.textContent = item.label;
        btn.addEventListener('click', () => {
          videoFrame.src = item.url;
          document.querySelectorAll('.music-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
        });
        videoPlaylists.appendChild(btn);
      });
    }

    function persistNotes() { saveStore({ notes: state.notes }); }

    function renderNotes() {
      notesList.innerHTML = '';
      notesEmpty.style.display = state.notes.length ? 'none' : 'block';
      clearNotesBtn.disabled = state.notes.length === 0;
      if (state.notes.length === 0) return;

      state.notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = 'sticky';
        card.style.setProperty('--sticky-bg', note.color || '#ECE4C8');

        const del = document.createElement('button');
        del.className = 'sticky-del';
        del.type = 'button';
        del.setAttribute('aria-label', 'Delete note');
        del.textContent = '×';
        del.addEventListener('click', () => {
          state.notes.splice(index, 1);
          persistNotes();
          renderNotes();
        });

        const toolbar = document.createElement('div');
        toolbar.className = 'sticky-toolbar';

        const meta = document.createElement('div');
        meta.className = 'sticky-meta';
        meta.textContent = 'Last edited';

        const colors = document.createElement('div');
        colors.className = 'sticky-colors';

        NOTE_COLORS.forEach(color => {
          const dot = document.createElement('button');
          dot.className = 'color-dot' + ((note.color || '#ECE4C8') === color ? ' active' : '');
          dot.type = 'button';
          dot.style.background = color;
          dot.setAttribute('aria-label', 'Set note color');
          dot.addEventListener('click', () => {
            state.notes[index].color = color;
            persistNotes();
            renderNotes();
          });
          colors.appendChild(dot);
        });

        const text = document.createElement('textarea');
        text.className = 'sticky-text';
        text.placeholder = 'Write here...';
        text.value = note.text || '';
        text.addEventListener('input', () => {
          state.notes[index].text = text.value;
          persistNotes();
        });

        toolbar.appendChild(meta);
        toolbar.appendChild(colors);
        card.appendChild(del);
        card.appendChild(toolbar);
        card.appendChild(text);
        notesList.appendChild(card);
      });
    }

    modes.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    startPauseBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    addNoteBtn.addEventListener('click', () => {
      state.notes.unshift({ text: '', color: '#ECE4C8', updatedAt: Date.now() });
      persistNotes();
      renderNotes();
    });

    clearNotesBtn.addEventListener('click', () => {
      state.notes = [];
      persistNotes();
      renderNotes();
    });

    perplexityForm.addEventListener('submit', e => {
      e.preventDefault();
      const query = perplexityInput.value.trim();
      if (!query) return;
      const url = `https://www.perplexity.ai/search?q=${encodeURIComponent(query)}`;
      window.open(url, '_blank', 'noopener');
    });

    updateDisplay();
    updateClock();
    renderNotes();
    renderPlaylists();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
