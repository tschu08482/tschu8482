<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #2f3437;
      --muted: #787774;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 0;
    }

    .clock-block {
      width: 100%;
      padding: 4px 0;
    }

    /* Row: time + date aligned horizontally */
    .clock-row {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
    }

    /* Time line: match Notion H1 ~32px */
    .clock-time {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .clock-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="clock-block">
    <div class="clock-row">
      <span class="clock-time" id="clockTime"></span>
      <span class="clock-sub" id="clockSub"></span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // 12‑hour time, no seconds
      const timeStr = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      // Weekday, month, day, year
      const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      document.getElementById('clockTime').textContent = timeStr;
      document.getElementById('clockSub').textContent = dateStr;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
