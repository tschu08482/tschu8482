<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Clock Single Line</title>
  <style>
    :root {
      --fg: #2f3437;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      background: transparent;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Remove extra height – let content define iframe height */
    body {
      padding: 0;
      display: block;
    }

    .clock-block {
      width: 100%;
      padding: 0; /* no extra vertical padding */
    }

    /* One heading-style line */
    .clock-line {
      display: inline-block;
      font-size: 32px;       /* Heading 1-ish */
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;   /* keep whole string on one line */
    }
  </style>
</head>
<body>
  <div class="clock-block">
    <span class="clock-line" id="clockLine"></span>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const timeStr = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      const weekday = now.toLocaleDateString('en-US', { weekday: 'short' });
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const year = now.getFullYear();

      const dateStr = `${weekday} ${month}/${day}/${year}`;

      document.getElementById('clockLine').textContent = `${timeStr} · ${dateStr}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
