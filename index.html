<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Clock Right-Centered</title>
  <style>
    :root {
      --fg: #2f3437;
      --muted: #787774; /* grey for time */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Flex: center vertically, align text to the right in the window */
    body {
      padding: 0;
      display: flex;
      align-items: center;        /* vertical center */
      justify-content: flex-end;  /* right side */
    }

    .clock-block {
      padding-right: 16px;
    }

    /* Single heading-style line */
    .clock-line {
      display: inline-block;
      font-size: 32px;            /* heading-ish */
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
      text-align: right;
    }

    /* Time in grey */
    .clock-time-grey {
      color: var(--muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="clock-block">
    <span class="clock-line" id="clockLine"></span>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Time
      const timeStr = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      // Day + date with full weekday name
      const weekday = now.toLocaleDateString('en-US', { weekday: 'long' });
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const year = now.getFullYear();
      const dateStr = `${weekday} ${month}/${day}/${year}`;

      // TODAY IS: + full day/date in black, time in grey
      document.getElementById('clockLine').innerHTML =
        `TODAY IS ${dateStr} · <span class="clock-time-grey">${timeStr}</span>`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
