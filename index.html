<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Clock</title>
  <style>
    :root {
      --fg: #2f3437;
      --muted: #787774;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 0;
    }

    .clock-block {
      width: 100%;
      padding: 2px 0;
    }

    /* Single line: time + date, styled like Notion H1 */
    .clock-row {
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
      font-size: 32px;          /* approximate Notion H1 */
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .clock-time {
      /* inherits heading style */
    }

    .clock-sub {
      font-size: 18px;          /* smaller, but same baseline */
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;      /* keep on same line */
    }
  </style>
</head>
<body>
  <div class="clock-block">
    <div class="clock-row">
      <span class="clock-time" id="clockTime"></span>
      <span class="clock-sub" id="clockSub"></span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const timeStr = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      document.getElementById('clockTime').textContent = timeStr;
      document.getElementById('clockSub').textContent = dateStr;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
