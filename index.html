<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer Notes-First</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #f7f6f3;
      --surface-2: #ffffff;
      --surface-3: #ffffff;
      --fg: #2f3437;
      --muted: #787774;
      --line: rgba(55, 53, 47, 0.12);
      --line-strong: rgba(55, 53, 47, 0.18);
      --accent: #2f3437;
      --accent-soft: rgba(47, 52, 55, 0.08);
      --danger: #2f3437;
      --radius: 12px;
      --radius-sm: 8px;
      --label-size: 10px;
      --small: 9px;
      --timer-size: 24px;
      --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-note: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .widget {
      width: min(1280px, 100%);
      max-width: 1280px;
      background: transparent;
      padding: 0;
      border: none;
    }

    .widget-shell {
      display: grid;
      gap: 12px;
    }

    .top-widgets {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .top-widgets > .panel,
    .top-widgets > .section {
      height: 100%;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 13px;
      background: var(--surface-2);
      box-shadow: var(--shadow-soft);
    }

    .notes-panel {
      width: 100%;
    }

    .clock-label, .section-title {
      font-size: var(--label-size);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
    }
